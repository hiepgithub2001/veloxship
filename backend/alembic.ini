[alembic]
script_location = alembic

# Migrations are named <NNNN>_<reason>.py; env.py assigns the sequential rev id.
file_template = %%(rev)s_%%(slug)s

# Load env.py for plain `alembic revision` too, so the rev-id hook always fires.
revision_environment = true
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@db:5432/veloxship

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
